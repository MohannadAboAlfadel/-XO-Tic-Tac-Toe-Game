<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XO Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>XO Game</h1>
        
        <!-- Start Screen -->
        <div id="start-screen">
            <p class="subtitle">Choose Game Mode</p>
            <button class="menu-btn" data-mode="pvp">Player vs Player</button>
            <button class="menu-btn" data-mode="pvc">Player vs Computer</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="hidden">
            <div id="status">Turn: X</div>
            <div id="board" class="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
            <div class="controls">
                <button id="reset-btn">Reset Game</button>
                <button id="back-btn">Back to Menu</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
